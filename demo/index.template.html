<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191e25">
  <meta name="description" content="Demo gameplay tự chạy của Đất Lành, từ lấy mẫu đất đến phục hồi ruộng lúa ở ấp Hạ Nguồn.">
  <title>Đất Lành · Demo gameplay</title>
  <style>/* DEMO_STYLES */</style>
</head>
<body>
  <main id="viewer" class="viewer">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon" data-icon="sprout" aria-hidden="true"></span>
        <h1>Đất Lành</h1>
      </div>
      <div class="viewer-actions">
        <span class="auto"><i></i><span id="mode-label">Đang tự phát</span></span>
        <button id="sound" class="icon-button" aria-label="Bật âm thanh" title="Bật âm thanh" aria-pressed="false" data-icon="mute"></button>
        <button id="fullscreen" class="icon-button" aria-label="Toàn màn hình" title="Toàn màn hình" data-icon="expand"></button>
      </div>
    </header>

    <section class="player" aria-label="Màn hình demo gameplay">
      <div class="mission">
        <span class="mission-icon" id="mission-icon" aria-hidden="true"></span>
        <strong id="objective">Xuôi ghe về ấp</strong>
        <span id="location">Ấp Hạ Nguồn</span>
      </div>
      <div id="screen" class="screen" data-view="intro">
        <canvas id="world" width="1000" height="560" aria-label="Cảnh minh họa ấp Hạ Nguồn"></canvas>
        <div id="fade" class="fade" aria-hidden="true"></div>
      </div>

      <div class="scene-notes">
        <div class="subtitle">
          <img id="portrait" width="40" height="40" alt="">
          <div><span id="speaker">Chị Ngọc</span><p id="caption">Ruộng vẫn xanh. Muốn biết vì sao gạo nhiễm Cd, mình phải lấy mẫu đất.</p></div>
        </div>
        <div id="equipment" class="equipment" hidden></div>
      </div>

      <div class="player-controls">
        <button id="play" class="play-button" aria-label="Tạm dừng" title="Tạm dừng" data-icon="pause"></button>
        <button id="restart" class="icon-button restart" aria-label="Xem lại từ đầu" title="Xem lại từ đầu" data-icon="rotate"></button>
        <span id="elapsed" class="time">0:00</span>
        <input id="seek" type="range" min="0" max="1" step=".1" value="0" aria-label="Tua tiến độ demo">
        <span id="length" class="time">0:00</span>
      </div>
    </section>

    <nav id="chapters" class="chapters" aria-label="Các cảnh"></nav>
    <footer class="credits">
      <span>Ấp Hạ Nguồn là bối cảnh hư cấu. Số đo minh họa cho gameplay.</span>
    </footer>
  </main>
  <noscript><p class="noscript">Bật JavaScript trong trình duyệt để xem demo gameplay.</p></noscript>
  <script>/* SCENE_IMAGES */</script>
  <script>/* PIXEL_ART */</script>
  <script>/* RESTORATION */</script>
  <script>/* DEMO_SCRIPT */</script>
</body>
</html>
